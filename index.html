<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operação: Informação que Protege</title>
<style>
:root{
  --bg:#eef3f6;--card:#ffffff;--ink:#14232f;--muted:#566874;--line:#d5dee5;
  --brand:#0e6b73;--brand-ink:#ffffff;--soft:#e4f1f2;--warn:#b45309;--warn-bg:#fdf1de;
  --ok:#157347;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe9e7;--focus:#1d4ed8;
  --hbg1:#0a2630;--hbg2:#0e4a55;--c:#0e6b73;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1820;--card:#13252e;--ink:#e7eff3;--muted:#9db0bc;--line:#2a4350;
    --brand:#46bcb8;--brand-ink:#04201f;--soft:#173640;--warn:#f0b04a;--warn-bg:#3a2d12;
    --ok:#5fd18c;--ok-bg:#12331f;--bad:#ff8a80;--bad-bg:#3d1a17;--focus:#8ab4ff;
    --hbg1:#061419;--hbg2:#0b3138;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);position:relative;color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--hbg1),var(--hbg2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hbar{max-width:900px;margin:0 auto;padding:10px 16px 6px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-weight:800;font-size:15px;letter-spacing:.02em}
.brand small{display:block;font-weight:500;opacity:.75;font-size:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.timer.late{background:#f0b04a;color:#2b1a00}
.timer small{font-weight:500;opacity:.8;margin-left:6px}
.map{max-width:900px;margin:0 auto;padding:2px 16px 10px;display:flex;align-items:flex-start}
.node{display:flex;flex-direction:column;align-items:center;gap:2px;width:62px;flex:0 0 62px;text-align:center}
.ni{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);transition:all .3s}
.nl{font-size:11px;opacity:.8;line-height:1.1}
.node.locked .ni{filter:grayscale(1);opacity:.6}
.node.locked .nl{opacity:.6}
.node.cur .ni{background:#f0b04a;border-color:#fff;box-shadow:0 0 0 0 rgba(240,176,74,.7);animation:pulse 1.6s infinite}
.node.cur .nl{opacity:1;font-weight:700}
.node.done .ni{background:#2fbf71;border-color:#c8f5dc;color:#052e17;font-weight:900}
.conn{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin-top:17px}
.conn.on{background:#2fbf71}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,176,74,.7)}70%{box-shadow:0 0 0 10px rgba(240,176,74,0)}100%{box-shadow:0 0 0 0 rgba(240,176,74,0)}}
main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.card.mission{border-top:8px solid var(--c)}
.mhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.mico{font-size:38px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--soft);flex:0 0 64px}
.kicker{margin:0 0 2px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:30px}
h2{font-size:25px}
h3{font-size:18px;margin:18px 0 8px;color:var(--c)}
p{margin:0 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
.chip{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:default}
.chip.cur{border-color:var(--c);color:var(--ink);background:var(--soft)}
.chip.past{border-color:var(--c);color:var(--c);cursor:pointer}
.panel{animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.obj{background:var(--soft);padding:10px 14px;border-radius:12px}
.bubble{background:var(--soft);border-radius:16px 16px 16px 4px;padding:12px 16px;margin:10px 0;max-width:94%;animation:rise .5s ease both}
.bubble:nth-of-type(2){animation-delay:.15s}.bubble:nth-of-type(3){animation-delay:.3s}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media (max-width:560px){.how{grid-template-columns:1fr}}
.how div{background:var(--soft);border-radius:14px;padding:10px 12px;text-align:center;font-weight:700}
.how span{display:block;font-size:26px}
.fact{border-left:6px solid var(--c);background:var(--soft);border-radius:0 14px 14px 0;padding:12px 16px;margin:12px 0}
.fact b.t{display:block;color:var(--c);font-size:18px;margin-bottom:4px}
.fact.no b.t{color:var(--bad)}
ul{margin:6px 0 8px;padding-left:22px}
li{margin:3px 0}
.q{font-weight:700;margin:20px 0 8px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{font:inherit;font-weight:800;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 22px;cursor:pointer;transition:transform .1s,border-color .1s}
.opt:hover{transform:translateY(-1px)}
.opt.sel{border-color:var(--c);background:var(--soft)}
.opts.stack{flex-direction:column}
.opts.stack .opt{text-align:left;font-weight:700}
.sent{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
@media (max-width:560px){.sent{grid-template-columns:1fr}}
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:64px;row-gap:0;margin:10px 0 6px;align-items:start}
@media (max-width:560px){.match{column-gap:38px}}
.mcol{display:flex;flex-direction:column;gap:10px;position:relative}
.mlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.mlines line{stroke-width:5;stroke-linecap:round}
.mlines line.tmp{stroke-dasharray:2 9;opacity:.85}
.mitem,.mtarget{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;min-height:56px;width:100%}
.mitem .mt,.mtarget .mt{flex:1;font-size:16px;line-height:1.3}
.mitem.armed,.mtarget.hot{border-color:var(--c);background:var(--soft)}
.mitem.linked{border-color:var(--c)}
.mtarget.linked{border-color:var(--c);background:var(--soft)}
.dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--c);background:var(--card);flex:0 0 24px;position:relative;z-index:2;touch-action:none;cursor:grab}
.dot::after{content:"";position:absolute;inset:-12px}
.mitem.linked .dot,.mtarget.linked .dot{background:var(--c)}
.mhelp{color:var(--muted);font-size:14px;margin-bottom:6px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
.post{border:3px dashed var(--warn);background:var(--warn-bg);border-radius:16px;padding:14px 16px;margin:10px 0}
.post small{color:var(--muted)}
.field{margin:14px 0}
.field label,.field .lbl{font-weight:700;display:block;margin-bottom:5px}
.field small{display:block;color:var(--muted);margin-top:3px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 22px;cursor:pointer;background:var(--c);color:#fff;transition:transform .1s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:700}
.msg.bad{background:var(--bad-bg);color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hints{margin-top:14px}
.hint{background:var(--warn-bg);border-radius:12px;padding:10px 14px;margin:6px 0}
.hint b{color:var(--warn)}
video,iframe.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;margin:6px 0}
.promptbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:240px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.chk input{margin-top:4px;width:20px;height:20px}
.chk:has(input:checked){border-color:var(--c);background:var(--soft)}
.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
.footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(5,20,26,.82);display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ovlbox{background:var(--card);border-radius:24px;padding:28px 24px;max-width:440px;width:100%;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.lock{color:var(--c);margin:0 auto 8px;width:110px;position:relative}
.lock svg{overflow:visible}
.lock .shackle{transition:transform .6s cubic-bezier(.3,1.5,.5,1) .25s;transform-origin:44px 28px}
.lock.open .shackle{transform:translate(0,-9px) rotate(32deg)}
.spark{position:absolute;font-size:22px;animation:fly 1.4s ease-out forwards;opacity:0}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}
.sparks{position:absolute;left:50%;top:55%;width:0;height:0}
.ovlbox h2{margin:6px 0 8px}
table.t{width:100%;border-collapse:collapse;margin:8px 0 14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}
.rep h2{font-size:20px;border-bottom:2px solid var(--brand);padding-bottom:4px;margin-top:22px}
.rep .box{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0 12px}
.hidden{display:none!important}
@media print{
  body{background:#fff;color:#000;font-size:11.5pt}
  header,.noprint,.footer,.ovl{display:none!important}
  main{max-width:none;padding:0}
  .card{border:0;padding:0;background:#fff;box-shadow:none}
  .rep .box,table.t th,table.t td{border-color:#999}
  .rep h2{border-color:#000;break-after:avoid}
  .rep .box,table.t{break-inside:avoid}
  @page{margin:16mm}
}

.postfig{margin:8px 0 6px;text-align:center}
.postimg{width:100%;max-width:480px;border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.postfig figcaption{color:var(--muted);font-size:13px;margin-top:4px}
.qr{display:inline-flex;align-items:center;gap:10px}
.qr img{border-radius:10px;border:1px solid var(--line);background:#fff}
.qr small{max-width:130px;color:var(--muted);line-height:1.25}
/* fundo dinâmico pastel */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:linear-gradient(125deg,#e6f5f1,#efeafb,#fdeee3,#e5f0fb,#e6f5f1);background-size:320% 320%;animation:bgshift 60s ease-in-out infinite}
.bgi{position:absolute;bottom:-90px;left:var(--x);font-size:var(--s);opacity:.2;filter:saturate(.55);
  animation:bgfloat var(--d) linear var(--dl) infinite;will-change:transform}
@keyframes bgshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes bgfloat{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(var(--dx),-65vh,0) rotate(calc(var(--r) * .5))}100%{transform:translate3d(0,-130vh,0) rotate(var(--r))}}
main{position:relative;z-index:2}
header{position:sticky;top:0;z-index:20}
@media (prefers-color-scheme:dark){
  #bg{background:linear-gradient(125deg,#0d1e24,#17172a,#1f1b26,#0e1f2b,#0d1e24);background-size:320% 320%}
  .bgi{opacity:.1}
}
@media (prefers-reduced-motion:reduce){
  #bg{animation:none}
  .bgi{animation:none;bottom:auto;top:var(--y)}
  .panel,.bubble,.ovlbox,.node.cur .ni,.msg.bad{animation:none}
}
@media print{#bg{display:none}}
</style>

function cyrb53(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
  h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
  h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

function matchHTML(items, targets){
  return `<div class="match">

      `<button type="button" class="mitem" data-k="${k}" data-c="${i % 5}"><span class="mt">${esc(t)}</span><span class="dot l"></span></button>`).join("")}</div>

/* ---------- Utilitários ---------- */
function fmt(sec){
  const neg = sec < 0; sec = Math.abs(Math.round(sec));
  return (neg ? "+" : "") + String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}
function elapsed(){ const end = S.fim || Date.now(); return S.inicio ? (end - S.inicio) / 1000 + S.penal : 0; }
function tick(){
  const t = $("#timer");
  if (!S.inicio){ t.classList.add("hidden"); return; }
  t.classList.remove("hidden");
  const rest = CONFIG.DURACAO_MIN * 60 - elapsed();
  t.classList.toggle("late", rest < 0);
  t.innerHTML = "⏱ " + fmt(rest) + "<small>" + (rest < 0 ? "além do previsto" : "restantes") + "</small>";
}
function drawMap(){
  const box = $("#map");
  if (S.fase === "start"){ box.classList.add("hidden"); box.innerHTML = ""; return; }
  box.classList.remove("hidden");
  let h = "";
  for (let i = 1; i <= 5; i++){
    const done = !!S.ok[i];
    const cur = !done && S.fase === "stage" && S.etapa === i;
    const st = done ? "done" : cur ? "cur" : "locked";
    h += `<div class="node ${st}"><span class="ni">${done ? "✓" : cur ? M[i].icon : "🔒"}</span><span class="nl">${M[i].nome}</span></div>`;
    if (i < 5) h += `<span class="conn ${S.ok[i] ? "on" : ""}"></span>`;
  }
  box.innerHTML = h;
}
function hintsList(n){
  return PISTAS[n].slice(0, S.pistas[n] || 0).map((p, i) => `<div class="hint"><b>Pista ${i + 1}:</b> ${esc(p)}</div>`).join("");
}
function promptText(){
  const r = S.resp, v = k => (r[k] || "").trim() || "[…]";
  return `Cria um cartaz digital de sensibilização dirigido a jovens do 9.º ano sobre ${v("p_tema")}.

Objetivo da campanha: combater o seguinte mito ou desconhecimento: ${v("p_mito")}.

Mensagem principal: ${v("p_msg")}.

Inclui visualmente a ideia de que ${v("p_facto")}.

Utiliza um estilo atual, claro, inclusivo e adequado a uma campanha de saúde escolar. Dá prioridade à legibilidade, a uma mensagem curta e a uma composição simples.

Evita imagens assustadoras, estereótipos, culpabilização ou informação não confirmada. Não inventes dados estatísticos nem recomendações médicas.`;
}

/* ---------- Validação ---------- */
function okKey(k){
  const v = S.resp[k], h = H[k];
  if (!v) return false;
  const got = cyrb53(k + ":" + v);
  return Array.isArray(h) ? h.includes(got) : h === got;
}
function checkStage(n){
  S.tent[n] = (S.tent[n] || 0) + 1;
  const wrong = KEYS[n].filter(k => !okKey(k)).length;
  const short = (TEXTS[n] || []).filter(t => (S.resp[t.id] || "").trim().length < t.min).length;
  if (!wrong && !short){
    S.ok[n] = true; save(); drawMap(); showUnlock(n); return;
  }
  save();
  const m = [];
  if (wrong) m.push(wrong === 1 ? "Há 1 resposta por rever." : "Há " + wrong + " respostas por rever.");
  if (short) m.push(short === 1 ? "Falta escrever uma resposta." : "Faltam escrever " + short + " respostas.");
  $("#fb").innerHTML = `<div class="msg bad">🔒 Ainda não abre! ${m.join(" ")} Relê a síntese e tenta outra vez.</div>`;
}
function giveHint(n){
  const k = S.pistas[n] || 0;
  if (k >= PISTAS[n].length) return;
  S.pistas[n] = k + 1; S.penal += CONFIG.PENALIZACAO_PISTA_MIN * 60;
  save(); tick();
  $("#hints").innerHTML = hintsList(n);
  updateHintBtn(n);
}

/* ---------- Ligações com riscos ---------- */
let armed = null, drag = null, lastDrag = 0, lastDragDot = null;
function center(el, box){ const r = el.getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top]; }
function drawLines(){
  $$(".match").forEach(m => {
    const box = m.getBoundingClientRect(), svg = $(".mlines", m);
    svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
    let h = "";
    const used = new Set();
    $$(".mitem", m).forEach(it => {
      const k = it.dataset.k, v = S.resp[k], col = COLORS[Number(it.dataset.c) % 5];
      const t = v ? $(`.mtarget[data-v="${CSS.escape(v)}"]`, m) : null;
      it.classList.toggle("linked", !!t);
      it.classList.toggle("armed", armed === k);
      const dot = $(".dot", it);
      dot.style.background = t ? col : ""; dot.style.borderColor = col;
      if (t){
        used.add(t);
        const a = center(dot, box), b = center($(".dot", t), box);
        h += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col}"/>`;
      }
    });
    $$(".mtarget", m).forEach(t => { t.classList.toggle("linked", used.has(t)); t.classList.toggle("hot", !!armed); });
    svg.innerHTML = h;
  });
}
function connect(k, v){
  S.resp[k] = v; save(); armed = null; drawLines();
}
document.addEventListener("pointerdown", e => {
  const d = e.target.closest(".dot.l");
  if (!d) return;
  const it = d.closest(".mitem");
  drag = { k: it.dataset.k, c: COLORS[Number(it.dataset.c) % 5], x: e.clientX, y: e.clientY, moved: false, m: d.closest(".match"), dot: d };
  try { d.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) drag.moved = true;
  if (!drag.moved) return;
  const box = drag.m.getBoundingClientRect(), a = center(drag.dot, box);
  const svg = $(".mlines", drag.m);
  $$("line.tmp", svg).forEach(l => l.remove());
  svg.insertAdjacentHTML("beforeend", `<line class="tmp" x1="${a[0]}" y1="${a[1]}" x2="${e.clientX - box.left}" y2="${e.clientY - box.top}" stroke="${drag.c}"/>`);
});
document.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  $$("line.tmp", d.m).forEach(l => l.remove());
  if (!d.moved) return;
  lastDrag = Date.now(); lastDragDot = d.dot;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const t = el && el.closest(".mtarget");
  if (t && d.m.contains(t)) connect(d.k, t.dataset.v); else drawLines();
});
document.addEventListener("pointercancel", () => { if (drag){ $$("line.tmp", drag.m).forEach(l => l.remove()); drag = null; } });

/* ---------- Ações ---------- */
function toPanel(i){ S.sub = i; save(); render(); window.scrollTo(0, 0); }
function act(a, el){
  const n = S.etapa;
  switch (a){
    case "begin":
      if (!S.turma.trim() || !S.n1.trim()){ $("#fb").innerHTML = `<div class="msg bad">Preenche a turma e, pelo menos, o nome do aluno 1.</div>`; return; }
      S.inicio = Date.now(); S.fase = "stage"; S.etapa = 1; S.sub = 0; save(); render(); break;
    case "cont": toPanel(S.sub + 1); break;
    case "back": toPanel(S.sub - 1); break;
    case "chip": if (Number(el.dataset.i) < S.sub) toPanel(Number(el.dataset.i)); break;
    case "unlock": checkStage(n); break;
    case "hint": giveHint(n); break;
    case "clearm": $$(".mitem").forEach(i => delete S.resp[i.dataset.k]); armed = null; save(); drawLines(); break;
    case "next": S.etapa = n + 1; S.sub = 0; save(); render(); window.scrollTo(0, 0); break;
    case "tofinal": S.fase = "final"; save(); render(); window.scrollTo(0, 0); break;
    case "copy": {
      const t = $("#f_prompt");
      const done = () => { const b = $('[data-act="copy"]'); if (b){ b.textContent = "Copiado ✔"; setTimeout(() => b.textContent = "Copiar prompt", 1800); } };
      try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand("copy"); done(); }); }
      catch (e){ t.select(); document.execCommand("copy"); done(); }
      break;
    }
    case "p5a":
      if (["p_tema", "p_mito", "p_msg", "p_facto"].some(i => val(i).length < 5)){ say("fbA", "Preencham as quatro respostas, mesmo que curtas."); return; }
      toPanel(1); break;
    case "p5b": toPanel(2); break;
    case "p5c":
      if (VERIF.some((_, i) => !$("#f_v" + i).checked)){ say("fbC", "Falta confirmar algum ponto. Se algo não está bem, corrijam o cartaz antes de continuar."); return; }
      toPanel(3); break;
    case "p5d":
      if (!$("#f_d_pub").checked || val("d_just").length < 30 || val("d_nova").length < 10 || val("d_fonte").length < 3){
        say("fbD", "Falta publicar no Padlet ou completar alguma resposta."); return; }
      S.ok[5] = true; save(); drawMap(); showUnlock(5); break;
    case "report":
      if (val("r1").length < 15 || (S.n2 && val("r2").length < 15)){ say("fb", "Cada aluno escreve a sua reflexão, mesmo que curta."); return; }
      if (!S.fim) S.fim = Date.now();
      S.fase = "report"; save(); render(); window.scrollTo(0, 0); break;
    case "backfinal": S.fase = "final"; save(); render(); break;
    case "print": window.print(); break;
    case "reset":
      const fim = S.fase === "final" || S.fase === "report";
      if (confirm(fim ? "Já guardaste o relatório em PDF? Ao recomeçar, apagas as respostas e o progresso deste computador e a página volta ao início para uma nova equipa."
                      : "Queres mesmo recomeçar? Perdes todo o progresso deste computador.")){
        try { localStorage.removeItem(KEY); } catch (e){}
        S = fresh(); render(); tick();
      }
      break;
  }
}

function render(){
  $$(".ovl").forEach(e => e.remove());
  armed = null;
  if (S.fase === "start") renderStart();
  else if (S.fase === "stage"){ renderStage(S.etapa); if (S.ok[S.etapa]) showUnlock(S.etapa); }
  else if (S.fase === "final") renderFinal();
  else renderReport();
  drawMap(); tick();
}

document.addEventListener("click", e => {
  const o = e.target.closest(".opt");
  if (o){ S.resp[o.dataset.k] = o.dataset.v; save(); applyChoices(); return; }
  if (lastDragDot && Date.now() - lastDrag < 150 && lastDragDot.contains(e.target)) return;
  const it = e.target.closest(".mitem");
  if (it){ armed = armed === it.dataset.k ? null : it.dataset.k; drawLines(); return; }
  const t = e.target.closest(".mtarget");
  if (t){ if (armed) connect(armed, t.dataset.v); return; }
  const b = e.target.closest("[data-act]");
  if (b && !b.disabled) act(b.dataset.act, b);
});
document.addEventListener("input", onInput);
document.addEventListener("change", onInput);
window.addEventListener("resize", drawLines);
window.addEventListener("load", drawLines);
if (window.ResizeObserver) new ResizeObserver(() => drawLines()).observe(document.body);

load(); render();
setInterval(tick, 1000);
/* ---------- Fundo dinâmico (ícones de saúde a flutuar devagar) ---------- */
(function(){
  const bg = document.getElementById("bg"); if (!bg) return;
  const icons = ["🩺","💊","❤️","🧬","🛡️","💧","🩹","🔬","➕","🧪","🌿","💙"];
  const rnd = (() => { let a = 12345; return () => (a = (a * 1664525 + 1013904223) % 4294967296) / 4294967296; })();
  for (let i = 0; i < 16; i++){
    const e = document.createElement("span");
    e.className = "bgi"; e.textContent = icons[i % icons.length];
    const d = 70 + rnd() * 60;
    e.style.cssText = `--x:${Math.round(rnd() * 94)}%;--s:${Math.round(26 + rnd() * 30)}px;--d:${d.toFixed(0)}s;--dl:-${(rnd() * d).toFixed(0)}s;--dx:${Math.round((rnd() - .5) * 140)}px;--r:${Math.round((rnd() - .5) * 90)}deg;--y:${Math.round(rnd() * 90)}%`;
    bg.appendChild(e);
  }
})();

</script>
</body>
